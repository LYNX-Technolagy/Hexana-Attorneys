<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: full-bleed ink, matching the hero -->
  <rect width="1200" height="630" fill="#1A1A1A"/>

  <!-- Subtle diagonal light streak (echoes the hero's bright sky, kept very quiet) -->
  <rect x="760" y="0" width="440" height="630" fill="#FFFFFF" fill-opacity="0.02"/>

  <!-- Top eyebrow: EAST LONDON · EASTERN CAPE -->
  <text x="80" y="110"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="14"
        font-weight="600"
        letter-spacing="2.52"
        fill="#E8C9CE">EAST LONDON · EASTERN CAPE</text>

  <!-- Description copy (mirrors the hero's desc-left) -->
  <text x="80" y="215"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20"
        font-weight="400"
        fill="#FFFFFF" fill-opacity="0.85">Sixteen years of legal experience.</text>
  <text x="80" y="245"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="20"
        font-weight="400"
        fill="#FFFFFF" fill-opacity="0.85">One local firm you can actually talk to.</text>

  <!-- Small burgundy rule (accent mark) -->
  <rect x="80" y="285" width="48" height="2" fill="#6B1F2A"/>

  <!-- Giant wordmark: Hexana Attorneys -->
  <text x="80" y="500"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="130"
        font-weight="500"
        letter-spacing="-2"
        fill="#FFFFFF">Hexana Attorneys</text>

  <!-- Bottom strip: burgundy, full-bleed, mirrors the trust bar position -->
  <rect x="0" y="565" width="1200" height="65" fill="#6B1F2A"/>
  <text x="80" y="604"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="13"
        font-weight="600"
        letter-spacing="2.34"
        fill="#FAF8F5">CIVIL · CRIMINAL · FAMILY · RAF CLAIMS · COMMERCIAL LITIGATION</text>

  <!-- LYNX credit, bottom right, quiet -->
  <text x="1120" y="604"
        text-anchor="end"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11"
        font-weight="500"
        letter-spacing="1.5"
        fill="#FAF8F5" fill-opacity="0.55">LYNX TECHNOLOGY</text>
</svg>